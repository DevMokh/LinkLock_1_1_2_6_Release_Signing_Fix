name: linklock
description: Local link encryption with device-bound AES-256-GCM or portable AES-128-GCM, plus optional server-backed web sharing.
publish_to: "none"
version: 1.1.2+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
