name = "linklock-share"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "linklock-shares"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
LINKLOCK_ACTIVE_KEY_ID = "v1"

[secrets]
required = ["LINKLOCK_MASTER_KEYS"]

[[ratelimits]]
name = "CREATE_RATE_LIMITER"
namespace_id = "84621017"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "84621018"

[ratelimits.simple]
limit = 5
period = 60
